name: Build macOS DMG (Manual)

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Node.js 24（GitHub Actions 默认） ----------
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ---------- Python ----------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # ---------- ffmpeg ----------
      - name: Install ffmpeg via Homebrew
        run: |
          brew install ffmpeg
          cp $(which ffmpeg) ./ffmpeg_mac
          chmod +x ./ffmpeg_mac

      # ---------- 构建 Python 后端 ----------
      - name: Build backend with PyInstaller
        run: |
          pyinstaller --noconfirm server.spec

      # ---------- 准备后端文件 ----------
      - name: Prepare backend for packaging (macOS)
        run: |
          mkdir -p frontend/backend
          cp -r dist/cyy_backend/* frontend/backend/
          cp ffmpeg_mac frontend/backend/ffmpeg
          chmod +x frontend/backend/ffmpeg
          chmod +x frontend/backend/cyy_backend

      # ---------- 修改 package.json 只构建 ARM64 ----------
      - name: Patch package.json for macOS (ARM64 only)
        run: |
          cd frontend
          jq '.build.extraResources = [] | .build.mac = {
            "icon": "../gui/icon.icns",
            "extraResources": [],
            "target": [{"target": "dmg", "arch": ["arm64"]}]
          } | .build.files = (.build.files // []) + ["backend/**/*"] | .build.asarUnpack = ["backend/**/*"]' package.json > package.json.tmp && mv package.json.tmp package.json
          cat package.json | grep -A 20 '"build"'

      # ---------- 构建 Electron DMG ----------
      - name: Build Electron DMG
        run: |
          cd frontend
          npx electron-builder --mac

      # ---------- 上传 DMG ----------
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: cYy-Music-macOS-ARM64-DMG
          path: dist-app/*.dmg
