name: Build macOS DMG (Manual)

on:
  workflow_dispatch:          # 仅手动触发

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Node.js ----------
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ---------- Python ----------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # ---------- 安装 ffmpeg（macOS） ----------
      - name: Install ffmpeg via Homebrew
        run: |
          brew install ffmpeg
          # 复制到项目根目录，命名为 ffmpeg_mac（供后续打包使用）
          cp $(which ffmpeg) ./ffmpeg_mac
          chmod +x ./ffmpeg_mac

      # ---------- 动态修改 package.json 以支持 macOS ----------
      - name: Patch package.json for macOS
        run: |
          cd frontend
          # 使用 jq 添加 mac 构建配置（只构建 DMG）
          jq '.build.mac = {
            "icon": "../gui/icon.icns",
            "extraResources": [
              {"from": "../dist/cyy_backend", "to": "backend"},
              {"from": "../ffmpeg_mac", "to": "backend/ffmpeg"}
            ],
            "target": [
              {"target": "dmg", "arch": ["x64", "arm64"]}
            ]
          }' package.json > package.json.tmp && mv package.json.tmp package.json
          # 打印确认（调试用）
          cat package.json | grep -A 15 '"mac"'

      # ---------- 构建 Python 后端 ----------
      - name: Build backend with PyInstaller
        run: |
          pyinstaller --noconfirm server.spec

      # ---------- 构建 Electron DMG ----------
      - name: Build Electron DMG
        run: |
          cd frontend
          npx electron-builder --mac

      # ---------- 上传 DMG ----------
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: cYy-Music-macOS-DMG
          path: dist-app/*.dmg      # 对应 package.json 中 directories.output
