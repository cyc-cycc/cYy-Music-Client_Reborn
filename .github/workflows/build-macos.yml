name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '可选：覆盖版本号（如 8.4.1），留空则沿用 package.json'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install FFmpeg
        run: |
          brew install ffmpeg
          ln -sf "$(which ffmpeg)" ./ffmpeg
          ./ffmpeg -version | head -n 1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting version to $VERSION"
          python set-version.py "$VERSION"

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          echo "Setting version to ${{ inputs.version }}"
          python set-version.py "${{ inputs.version }}"

      # ---------- 清理 package.json 顶层 extraResources ----------
      # 顶层 extraResources 会在 macOS 构建时尝试复制 ffmpeg.exe（Windows 专用）并报错。
      # 正确的配置是分别放在 win.extraResources / mac.extraResources 里。
      - name: Strip top-level extraResources
        working-directory: frontend
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf-8'));
            if (p.build && p.build.extraResources) {
              delete p.build.extraResources;
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('已删除 build.extraResources（顶层）');
            } else {
              console.log('顶层 extraResources 不存在，跳过');
            }
          "

      - name: Build backend (PyInstaller)
        run: pyinstaller --noconfirm --clean server.spec

      - name: Verify backend binary
        run: |
          ls -lah dist/cyy_backend/
          file dist/cyy_backend/cyy_backend

      # ---------- 展开后端符号链接 ----------
      # PyInstaller 在 macOS 上产出的 _internal 里含 Python.framework 符号链接，
      # electron-builder 复制时会出现 EEXIST。cp -RL 把符号链接展开为真实副本。
      - name: Flatten backend symlinks
        run: |
          cd dist
          mv cyy_backend cyy_backend_orig
          cp -RL cyy_backend_orig cyy_backend
          rm -rf cyy_backend_orig
          if find cyy_backend -type l | grep -q .; then
            echo "✘ 仍存在符号链接："
            find cyy_backend -type l
            exit 1
          fi
          echo "✔ 符号链接已全部展开"
          file cyy_backend/cyy_backend

      - name: Build Electron app (DMG + ZIP)
        working-directory: frontend
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }}

      - name: List artifacts
        run: ls -lah dist-app/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist-app/*.dmg
            dist-app/*.zip
          if-no-files-found: error
          retention-days: 30
