<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        user-select: none; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #dl-root {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 2px;
      padding: 4px 20px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      -webkit-app-region: drag;
    }
    .dl-line {
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
    }
    #dl-current {
      font-size: 28px;
      color: #fff;
      line-height: 1.3;
    }
    #dl-next {
      font-size: 16px;
      color: rgba(255,255,255,0.55);
      line-height: 1.2;
    }
    .dl-empty {
      color: rgba(255,255,255,0.5);
      font-size: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="dl-root">
    <div id="dl-current" class="dl-line dl-empty">cYy Music</div>
    <div id="dl-next" class="dl-line"></div>
  </div>
  <script src="desktop-lyric-renderer.js"></script>
</body>
</html>
